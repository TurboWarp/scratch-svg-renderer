<svg xmlns="http://www.w3.org/2000/svg">
    <defs>
        <path mask="url(data:using-path-mask-attribute)"></path>
    </defs>

    <circle fill="url(data:using-circle-fill-attribute)"></circle>
    <circle style="fill: url(data:using-circle-fill-inline-style)"></circle>

    <rect stroke="url(data:using-rect-stroke-attribute)"></rect>
    <rect style="stroke: url(data:using-rect-fill-inline-style)"></rect>

    <style>
        .url {
            fill: url(data:using-fill-stylesheet);
            stroke: url(data:using-stroke-stylesheet);
            background-image: url(data:using-background-image-stylesheet);
            shape-outside: url(data:using-shape-outside-stylesheet);
            filter: url(data:using-filter-stylesheet);
            mask-image: url(data:using-mask-image-stylesheet);
        }
    </style>
    <rect class="url"></rect>

    <style>
        @font-face {
            font-family: 'Test Font';
            src: url(data:using-font-face.woff) format(woff), url(data:using-font-face.woff2) format(woff2);
        }
        text {
            font-family: 'Test Font';
        }
    </style>
    <text y="20" x="10">Use developer tools to observe some requests to invalid data: URLs</text>
</svg>
